name: One-shot Linode four-deck smoke

on:
  push:
    paths:
      - .github/workflows/linode-four-deck-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMANDER_GYM_ARGENTUM_URL: ${{ secrets.ARGENTUM_GATEWAY_URL }}
      COMMANDER_GYM_ARGENTUM_TOKEN: ${{ secrets.ARGENTUM_GATEWAY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMMANDER_GYM_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model client
        run: python -m pip install -r requirements-openai.txt
      - name: Validate required secrets without revealing them
        shell: bash
        run: |
          test -n "$COMMANDER_GYM_ARGENTUM_URL"
          test -n "$COMMANDER_GYM_ARGENTUM_TOKEN"
          test -n "$OPENAI_API_KEY"
      - name: Build exact-roster game manifest
        run: |
          mkdir -p test-runs/linode-four-deck-smoke
          python scripts/validate_argentum_roster.py rosters/argentum-native-v1/manifest.json
          python scripts/build_argentum_roster_game.py \
            rosters/argentum-native-v1/manifest.json \
            --model gpt-5.6-luna \
            --output test-runs/linode-four-deck-smoke/manifest.json
      - name: Run terminal four-seat game
        run: |
          python -m commander_gym.full_game \
            --manifest test-runs/linode-four-deck-smoke/manifest.json \
            --output-dir test-runs/linode-four-deck-smoke \
            --run-id linode-argentum-native-v1-smoke-${GITHUB_RUN_ID} \
            --game-count 1 \
            --seed 20260921 \
            --max-choices 100000 \
            --timeout 30
      - name: Write compact evidence summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("test-runs/linode-four-deck-smoke")
          root.mkdir(parents=True, exist_ok=True)
          candidates = sorted(p for p in root.glob("linode-*.json"))
          summary = {"artifact_found": bool(candidates)}
          if candidates:
              data = json.loads(candidates[-1].read_text())
              run = data.get("run", {})
              summary.update({
                  "artifact": str(candidates[-1]),
                  "qualification": data.get("qualification"),
                  "training_eligible": data.get("training_eligible"),
                  "run_id": run.get("run_id"),
                  "started_at": run.get("started_at"),
                  "finished_at": run.get("finished_at"),
                  "engine": run.get("engine"),
                  "termination": run.get("termination"),
                  "participants": run.get("participants"),
                  "metrics": run.get("metrics"),
                  "metadata": run.get("metadata"),
                  "failure_count": len(data.get("failures", [])),
                  "failures": data.get("failures", []),
              })
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Upload retained smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linode-four-deck-smoke-${{ github.run_id }}
          path: test-runs/linode-four-deck-smoke/
          if-no-files-found: warn
          retention-days: 14
