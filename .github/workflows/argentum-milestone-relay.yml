name: Argentum milestone relay (quarantined)

# Transitional bootstrap path retained only for emergency archaeology/manual fallback.
# The direct authenticated gateway path completed its live proof on 2026-09-20.
# Do not restore a push/issue trigger here; normal orchestration must use
# ArgentumGymClient / ArgentumOrchestrator through the direct gateway.
on:
  workflow_dispatch:
    inputs:
      confirm_quarantined_relay:
        description: "Type USE_QUARANTINED_RELAY to run the retired bootstrap transport"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: argentum-relay-quarantined
  cancel-in-progress: false

jobs:
  relay:
    if: ${{ inputs.confirm_quarantined_relay == 'USE_QUARANTINED_RELAY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARGENTUM_GATEWAY_URL: ${{ secrets.ARGENTUM_GATEWAY_URL }}
      ARGENTUM_GATEWAY_TOKEN: ${{ secrets.ARGENTUM_GATEWAY_TOKEN }}
      ARGENTUM_RELAY_COMMAND_FILE: relay-command.json
      ARGENTUM_RELAY_OUTPUT: argentum-relay-result.md

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Explain quarantine
        run: |
          echo "::warning::This workflow is a quarantined transitional relay. Use the direct authenticated Commander Gym gateway for normal orchestration."

      - name: Execute strict Argentum relay command
        id: relay
        continue-on-error: true
        run: PYTHONPATH=. python scripts/argentum_issue_relay.py

      - name: Publish relay result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 7 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$ARGENTUM_RELAY_OUTPUT"

      - name: Preserve fail-closed workflow status
        if: steps.relay.outcome != 'success'
        run: exit 1
