name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-runtime-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact hashed manual SDK closure
        run: python -m pip install -r requirements-manual-runtime.txt
      - name: Qualify manual runtime with fake provider only
        run: python -m unittest discover -s tests -p 'test_manual_runtime*.py' -v
        env:
          REQUIRE_MANUAL_SDK_TESTS: '1'
      - name: Qualify isolated Linux systemd ordering
        run: sudo --preserve-env=PYTHONPATH,REQUIRE_MANUAL_SYSTEMD_TESTS "$(command -v python)" -m unittest discover -s tests -p test_manual_runtime_systemd_linux.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
          REQUIRE_MANUAL_SYSTEMD_TESTS: '1'
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog MCP test dependency
        run: python -m pip install -r requirements-catalog-mcp.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Qualify isolated recorder peer separation
        run: sudo --preserve-env=PYTHONPATH "$(command -v python)" -m unittest discover -s tests -p test_recorder_bridge_linux.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests

  jvm-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: commander-gym
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: Blue42hand/argentum-engine
          # Exact native baseline for the staged manual-runtime package; no host activation.
          ref: 45907c29a10aff549ce542f4cc7f6ea6359debc1
          path: argentum-engine
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test pinned Argentum integration seam
        run: ./argentum-engine/gradlew -p commander-gym/jvm-adapter test jar
        env:
          ARGENTUM_ENGINE_DIR: ${{ github.workspace }}/argentum-engine
      - name: Package and inspect matched server adapter
        run: |
          ./argentum-engine/gradlew -p argentum-engine :game-server:bootJar \
            -PaiControllerAdapterJar="$GITHUB_WORKSPACE/commander-gym/jvm-adapter/build/libs/commander-gym-argentum-adapter.jar"
          python commander-gym/scripts/qualify_manual_luna_release.py \
            --server-jar "$(find argentum-engine/game-server/build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)" \
            --adapter-jar commander-gym/jvm-adapter/build/libs/commander-gym-argentum-adapter.jar \
            --native-sha "$(git -C argentum-engine rev-parse HEAD)" \
            --gym-sha "$(git -C commander-gym rev-parse HEAD)" \
            --output manual-luna-release.json
