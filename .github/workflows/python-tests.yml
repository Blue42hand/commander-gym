name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  jvm-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: commander-gym
      # The game-server adapter branch consumes generic external-controller contracts staged on
      # Blue42hand/argentum-engine main until those changes land upstream. Keep unrelated branches
      # on vanilla upstream so Commander Gym does not silently grow a permanent fork dependency.
      - name: Checkout staged Argentum dependency
        if: github.event_name == 'pull_request' && (github.head_ref == 'codex/game-server-action-params' || github.head_ref == 'codex/live-human-three-luna-proof')
        uses: actions/checkout@v6
        with:
          repository: Blue42hand/argentum-engine
          ref: main
          path: argentum-engine
      - name: Checkout vanilla Argentum
        if: github.event_name != 'pull_request' || (github.head_ref != 'codex/game-server-action-params' && github.head_ref != 'codex/live-human-three-luna-proof')
        uses: actions/checkout@v6
        with:
          repository: wingedsheep/argentum-engine
          path: argentum-engine
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Argentum adapter
        run: ./argentum-engine/gradlew -p commander-gym/jvm-adapter test
        env:
          ARGENTUM_ENGINE_DIR: ${{ github.workspace }}/argentum-engine
