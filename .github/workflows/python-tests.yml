name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-runtime-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact hashed manual SDK closure
        run: python -m pip install -r requirements-manual-runtime.txt
      - name: Qualify manual runtime with fake provider only
        run: python -m unittest discover -s tests -p 'test_manual_runtime*.py' -v
        env:
          REQUIRE_MANUAL_SDK_TESTS: '1'
      - name: Qualify isolated Linux systemd ordering
        run: sudo --preserve-env=PYTHONPATH,REQUIRE_MANUAL_SYSTEMD_TESTS "$(command -v python)" -m unittest discover -s tests -p test_manual_runtime_systemd_linux.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
          REQUIRE_MANUAL_SYSTEMD_TESTS: '1'
      - name: Build disposable systemd credential reader fixture
        run: |
          context=$(mktemp -d)
          cp -r commander_gym tests "$context/"
          docker build -f tests/systemd-credentials.Dockerfile -t manual-credential-fixture "$context"
      - name: Qualify actual nonroot credential copies without host bus or network
        run: |
          container=$(docker run -d --privileged --cgroupns=private --network=none --tmpfs /run --tmpfs /run/lock manual-credential-fixture)
          trap 'docker rm -f "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" systemctl list-units >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PYTHONPATH=/opt/fixture:/opt/fixture/tests -e REQUIRE_SYSTEMD_CREDENTIALS=1 "$container" \
            python3 -B -m unittest discover -s /opt/fixture/tests -p test_manual_runtime_credentials_systemd.py -v
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog MCP test dependency
        run: python -m pip install -r requirements-catalog-mcp.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Qualify isolated recorder peer separation
        run: sudo --preserve-env=PYTHONPATH "$(command -v python)" -m unittest discover -s tests -p test_recorder_bridge_linux.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests

  jvm-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: commander-gym
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: Blue42hand/argentum-engine
          # Exact reviewed native QA callback gate merge; source qualification only.
          ref: 6aee3965887e69f92da5a66c27a3b1874b169504
          path: argentum-engine
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test pinned Argentum integration seam
        run: ./argentum-engine/gradlew -p commander-gym/jvm-adapter test jar
        env:
          ARGENTUM_ENGINE_DIR: ${{ github.workspace }}/argentum-engine
      - name: Qualify actual native writer and canonical v2 restore
        run: |
          fixture_root=$(mktemp -d)
          chmod 700 "$fixture_root"
          COMMANDER_GYM_CANONICAL_FIXTURE_ROOT="$fixture_root" \
          COMMANDER_GYM_CANONICAL_FIXTURE_ENGINE_SHA="$(git -C argentum-engine rev-parse HEAD)" \
            ./argentum-engine/gradlew -p argentum-engine :game-server:test \
              --tests com.wingedsheep.gameserver.recording.CanonicalCallbackFixtureTest --rerun
          PYTHONPATH=commander-gym python commander-gym/scripts/qualify_canonical_v2_fixture.py \
            --root "$fixture_root" --gym-sha "$(git -C commander-gym rev-parse HEAD)" \
            > canonical-v2-fixture.json
          cat canonical-v2-fixture.json
      - name: Package and inspect matched server adapter
        run: |
          ./argentum-engine/gradlew -p argentum-engine :game-server:bootJar \
            -PaiControllerAdapterJar="$GITHUB_WORKSPACE/commander-gym/jvm-adapter/build/libs/commander-gym-argentum-adapter.jar"
          server_jar=$(find argentum-engine/game-server/build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)
          python commander-gym/scripts/qualify_manual_luna_release.py \
            --server-jar "$server_jar" \
            --adapter-jar commander-gym/jvm-adapter/build/libs/commander-gym-argentum-adapter.jar \
            --native-sha "$(git -C argentum-engine rev-parse HEAD)" \
            --gym-sha "$(git -C commander-gym rev-parse HEAD)" \
            --require-qa-callback-gate \
            --output manual-luna-release.json
          mkdir matched-release
          cp "$server_jar" matched-release/server.jar
          cp commander-gym/jvm-adapter/build/libs/commander-gym-argentum-adapter.jar matched-release/adapter.jar
          cp manual-luna-release.json canonical-v2-fixture.json matched-release/
      - name: Preserve matched source qualification artifacts
        uses: actions/upload-artifact@v6
        with:
          name: canonical-v2-matched-release
          path: matched-release/
          retention-days: 7
          compression-level: 0
